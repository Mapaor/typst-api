services:
  typst-api:
    # CHOOSING THE IMAGE
    # ---- Local development ----
    # image: typst-api:latest
    # build: .
    # ---- DockerHub ----
    image: mapaor4/typst-api:latest
    # THE ACTUAL DESIGN
    # There is no need to change anything here, simply use or not the override file
    # (See docker-compose.override.yml if you are a developer)
    
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - PORT=${PORT:-8080}
      - RUST_LOG=${RUST_LOG:-info}
      - TYPST_FONT_PATHS=/fonts,/var/lib/typst-api/fonts
      - CACHE_ALL_133_TYPST_FONTS=${CACHE_ALL_133_TYPST_FONTS:-false}
      - FONTS_CACHE_DIR=/var/lib/typst-api/fonts
      - MAX_PAYLOAD_SIZE=${MAX_PAYLOAD_SIZE:-52428800} # 50MB
      - COMPILATION_TIMEOUT=${COMPILATION_TIMEOUT:-10}
      - MAX_CONCURRENT_COMPILATIONS=${MAX_CONCURRENT_COMPILATIONS:-10}
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - PRELOAD_PACKAGES=${PRELOAD_PACKAGES:-}
      - CACHE_ALL_PACKAGES=${CACHE_ALL_PACKAGES:-false}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - ./fonts:/fonts:ro
      - typst-packages:/root/.cache/typst/packages
      - typst-fonts:/var/lib/typst-api/fonts
    restart: unless-stopped

volumes:
  typst-packages:
  typst-fonts:
