[package]
name = "typst-api"
version = "0.2.0"
edition = "2024"

[dependencies]
typst-kit = { version = "0.15.1", features = ["system-packages", "system-downloader", "system-files"] }
axum = { version = "0.8.9", features = ["multipart"] }
chrono = "0.4.45"
comemo = "0.5.1"
dotenvy = "0.15.7"
fontdb = "0.24.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
typst = "0.15.1"
typst-pdf = "0.15.1"
tower = { version = "0.5.3", features = ["limit"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }
reqwest = { version = "0.13.5", features = ["json"] }
dirs = "7.0.0"
