<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typst API Playground</title>
    <style>
        :root {
            --bg: #f2f2f2;
            --panel: #ffffff;
            --line: #cfcfcf;
            --text: #111111;
            --muted: #666666;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
        }

        h1 {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
        }

        .container {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .left-panel {
            width: 40%;
            min-width: 300px;
            padding: 1rem;
            border-right: 1px solid var(--line);
            background: var(--panel);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .right-panel {
            flex: 1;
            background: #ffffff;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--muted);
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 0.5rem 0.6rem;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--text);
            font-family: monospace;
            font-size: 0.85rem;
        }

        textarea {
            min-height: 200px;
            resize: none;
            flex: 1;
        }

        button {
            padding: 0.6rem 1rem;
            border: 1px solid var(--line);
            background: #ececec;
            color: var(--text);
            cursor: pointer;
            align-self: flex-start;
        }

        button:disabled {
            opacity: 0.65;
            cursor: default;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .status {
            display: block;
            min-height: 3rem;
            padding: 0.75rem;
            border: 1px solid var(--line);
            background: #f7f7f7;
            color: var(--text);
            font-size: 0.85rem;
            white-space: pre-wrap;
            font-family: monospace;
        }

        .status.error {
            background: #f2f2f2;
            border-color: #9a9a9a;
            color: var(--text);
        }

        .status.info {
            background: #f7f7f7;
            border-color: var(--line);
            color: var(--text);
        }
    </style>
</head>
<body>
    <header>
        <h1>Typst API Playground</h1>
    </header>
    <div class="container">
        <div class="left-panel">
            <div>
                <label for="token">Authorization Token</label>
                <input type="text" id="token" placeholder="Bearer token (only required if `AUTH_TOKEN` is set)">
            </div>
            
            <div style="flex: 1; display: flex; flex-direction: column;">
                <label for="source">Typst Source Code</label>
                <textarea id="source">= Hello Typst!

This playground is a simple use case for the API. Edit this text and then hit `Ctrl+Enter` or click the 'Compile PDF' button. It internally does an HTTP request to the `/compile/source` endpoint using JavaScript. 

Here's a Feynmann diagram made using the `fletcher` package:

#import "@preview/fletcher:0.5.8": diagram, edge

#align(center)[
#diagram($
	e^- edge("rd", "-<|-") & & & edge("ld", "-|>-") e^+ \
	& edge(gamma, "wave") \
	e^+ edge("ru", "-|>-") & & & edge("lu", "-<|-") e^- \
$)
]

You can also use custom fonts, let's try it!

#set text(font: "IBM Plex Sans")

This is written in IBM Plex Sans. #lorem(40)

You can check the full list of fonts currently present in the server with `GET fonts/`.
</textarea>
            </div>

            <button id="compileBtn">Compile PDF</button>
            <div id="status" class="status info">Waiting for initial compilation...</div>
        </div>
        <div class="right-panel">
            <iframe id="pdfPreview" title="PDF Preview"></iframe>
        </div>
    </div>

    <script>
        const compileBtn = document.getElementById('compileBtn');
        const sourceTextarea = document.getElementById('source');
        const tokenInput = document.getElementById('token');
        const pdfPreview = document.getElementById('pdfPreview');
        const statusDiv = document.getElementById('status');

        statusDiv.className = 'status info';
        statusDiv.textContent = 'Waiting for initial compilation...';

        async function compilePdf() {
            compileBtn.disabled = true;
            compileBtn.textContent = 'Compiling...';
            statusDiv.className = 'status info';
            statusDiv.textContent = 'Compiling...';
            
            const sourceCode = sourceTextarea.value;
            const token = tokenInput.value.trim();

            const headers = { 'Content-Type': 'application/json' };
            if (token) {
                headers['Authorization'] = token.startsWith('Bearer ') ? token : `Bearer ${token}`;
            }

            try {
                // Using relative path to work on any domain/port
                const response = await fetch('/compile/source', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        source: sourceCode,
                        filename: "main.typ"
                    })
                });

                if (!response.ok) {
                    let errorText = await response.text();
                    try {
                        const errObj = JSON.parse(errorText);
                        if (errObj.message) errorText = errObj.message;
                    } catch(e) {}
                    throw new Error(`Error ${response.status}: ${errorText}`);
                }

                const pdfBlob = await response.blob();
                const blobUrl = URL.createObjectURL(pdfBlob);
                
                // Revoke old URL to prevent memory leaks if one exists
                if (pdfPreview.src && pdfPreview.src.startsWith('blob:')) {
                    URL.revokeObjectURL(pdfPreview.src);
                }
                
                pdfPreview.src = blobUrl;
                statusDiv.className = 'status info';
                statusDiv.textContent = 'Compiled successfully.';
            } catch (err) {
                statusDiv.className = 'status error';
                statusDiv.textContent = err.message;
                pdfPreview.src = '';
            } finally {
                compileBtn.disabled = false;
                compileBtn.textContent = 'Compile PDF';
            }
        }

        compileBtn.addEventListener('click', compilePdf);

        // Allow Ctrl+Enter / Cmd+Enter to compile
        sourceTextarea.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                compilePdf();
            }
        });
    </script>
</body>
</html>
